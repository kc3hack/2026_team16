services:
  engineer-hub:
    build: .
    ports:
      - "8000:8000"
    privileged: true
    volumes:
      - .:/app
      - /dev:/dev
    environment:
      - PYTHONUNBUFFERED=1
    
    env_file:
      - .env
    command: uvicorn main:app --app-dir backend --host 0.0.0.0 --port 8000 --reload
    restart: always