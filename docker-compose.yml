services:
  engineer-hub:
    build: .
    network_mode: "host"
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus  # Bluetooth通信の通り道をコンテナに繋ぐ
      - .:/app
      - /dev:/dev
    environment:
      - PYTHONUNBUFFERED=1
    
    env_file:
      - .env
    command: uvicorn main:app --app-dir backend --host 0.0.0.0 --port 8000 --reload
    restart: always